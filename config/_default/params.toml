colorScheme = "blowfish"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

mainSections = ["posts"]

[header]
    layout = "basic"

[footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

[homepage]
    layout = "profile"
    showRecent = true
    showRecentItems = 5
    showMoreLink = true
    showMoreLinkDest = "/posts/"
    cardView = true

[article]
    showDate = true
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true

[list]
    showCards = true
    groupByYear = false

[verification]
    bing = "C5034310EA3D5E690D5538762BC1B8FF"