baseURL: "https://gsfalcon.github.io/"
title: "gsFALCON"
theme: PaperMod
languageCode: "pt-BR"
defaultContentLanguage: "pt"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  homeInfoParams:
    Title: "gsFALCON 🦅"
    Content: "Another Random Tech Blog"
  socialIcons:
    - name: github
      url: "https://github.com/gsfalcon"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: Tags
      url: /tags/
      weight: 2
    - name: Arquivo
      url: /archive/
      weight: 3
    - name: Busca
      url: /search/
      weight: 4
    - name: Sobre
      url: /sobre/
      weight: 5
