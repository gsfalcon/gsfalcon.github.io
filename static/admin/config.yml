backend:
  name: github
  repo: gsfalcon/gsfalcon.github.io
  branch: main
  base_url: https://sveltia-cms-auth.gsfalcon.workers.dev

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "text", required: false, hint: "Resumo curto pra SEO e preview" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Categories", name: "categories", widget: "list", default: [], required: false }
      - { label: "Cover", name: "cover", widget: "object", required: false, fields: [ { label: "Image", name: "image", widget: "image", required: false }, { label: "Alt Text", name: "alt", widget: "string", required: false }, { label: "Caption", name: "caption", widget: "string", required: false } ] }
      - { label: "Show Table of Contents", name: "ShowToc", widget: "boolean", default: false, required: false }
      - { label: "Canonical URL", name: "canonicalURL", widget: "string", required: false, hint: "Preencha só se o post for republicado de outro lugar" }
      - { label: "Body", name: "body", widget: "markdown" }
